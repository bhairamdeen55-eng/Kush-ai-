[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'No build step needed — static site + functions'"

[functions]
  node_bundler = "esbuild"

# Cache the APK aggressively is NOT desired since you'll update it often —
# keep it no-cache so users always get the latest build when you replace it.
[[headers]]
  for = "/kushai.apk"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=kushai.apk"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200
