  <script>
    // ================================================================
    // 📱 MOBILE VIEWPORT HEIGHT FIX
    // Mobile browsers (Chrome/Safari) do not reliably recalc 100vh/100dvh
    // when the on-screen keyboard opens or the address bar shows/hides.
    // This keeps a live, accurate height in --app-height so the footer
    // (attach / model picker / send button) never gets pushed off-screen.
    // ================================================================
    function setAppHeight() {
      var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppHeight);
      window.visualViewport.addEventListener('scroll', setAppHeight);
    }
    setAppHeight();

    // ================================================================
    // Footer above keyboard handler (keeps footer visible when keyboard opens)
    // Runs on DOMContentLoaded so elements exist.
    // ================================================================
    (function() {
      function updateFooterPosition() {
        const footer = document.querySelector('footer');
        const appMain = document.getElementById('appMain');
        const msgs = document.getElementById('msgs');
        if (!footer) return;

        const fh = Math.ceil(footer.offsetHeight || 76);
        document.documentElement.style.setProperty('--footer-height', fh + 'px');

        if (appMain) appMain.style.paddingBottom = fh + 'px';
        if (msgs) msgs.style.paddingBottom = `calc(${fh}px + 18px)`;

        const vv = window.visualViewport;
        if (vv) {
          const keyboardHeight = Math.max(0, window.innerHeight - vv.height - (vv.offsetTop || 0));
          footer.style.transform = keyboardHeight > 0 ? `translateY(-${keyboardHeight}px)` : 'translateY(0)';
        } else {
          footer.style.transform = 'translateY(0)';
        }
      }

      document.addEventListener('DOMContentLoaded', function(){
        updateFooterPosition();

        window.addEventListener('resize', updateFooterPosition);
        window.addEventListener('orientationchange', updateFooterPosition);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateFooterPosition);
          window.visualViewport.addEventListener('scroll', updateFooterPosition);
        }

        const inp = document.getElementById('inp');
        if (inp) {
          inp.addEventListener('focus', () => setTimeout(updateFooterPosition, 50));
          inp.addEventListener('blur',  () => setTimeout(updateFooterPosition, 50));
        }

        window.addEventListener('load', () => setTimeout(updateFooterPosition, 100));
      });
    })();
  </script>
