name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Org ID + Project ID API se khud nikaalo — aapko kuch daalna nahi
      - name: Vercel project dhoondo (API se)
        id: ids
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          ORG_ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user | jq -r .user.id)
          PROJECT_ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects" | jq -r '.projects[] | select(.name=="kushai") | .id')
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ 'kushai' project nahi mila. Aapke projects:"
            curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects" | jq -r '.projects[].name'
            exit 1
          fi
          echo "org=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Project mila: $PROJECT_ID"

      # CLI ke liye link file banao
      - name: Project link karo
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"${{ steps.ids.outputs.org }}\",\"projectId\":\"${{ steps.ids.outputs.project }}\"}" > .vercel/project.json

      - name: Vercel CLI install karo
        run: npm install -g vercel

      - name: Env config lo
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build karo
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Production deploy karo
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
